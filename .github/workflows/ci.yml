name: Continuous Integration

on:
  push:
    branches:
      - dev
      - master

  pull_request:
    branches:
      - dev
      - master

jobs:
  # VOTAR-488: el ruleset exige el check `ci`. El job homónimo más abajo
  # solo pasa si calidad, CodeQL y secret scanning pasan, así que un
  # hallazgo crítico o un secreto bloquean el merge sin cambiar el ruleset.
  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read

  secret-scanning:
    uses: ./.github/workflows/secret-scanning.yml
    permissions:
      contents: read

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: Run unit tests
        run: npm run test:unit

      - name: Verify nginx security headers template sync
        run: npm run verify:nginx-security-headers

      - name: Build the project
        run: npm run build

      - name: Verify security headers on preview
        run: |
          npm run preview:ci &
          PREVIEW_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          SECURITY_HEADERS_URL=http://127.0.0.1:4173/ npm run verify:security-headers
          kill $PREVIEW_PID

  ci:
    needs: [quality, codeql, secret-scanning]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require quality, CodeQL and secret scanning
        env:
          QUALITY: ${{ needs.quality.result }}
          CODEQL: ${{ needs.codeql.result }}
          SECRETS: ${{ needs.secret-scanning.result }}
        run: |
          set -eu
          failed=0
          for name in QUALITY CODEQL SECRETS; do
            result="${!name}"
            echo "$name=$result"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"

  browser-tests:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble

    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run browser tests
        # Retry once: Vitest browser can flake if Vite mid-run dep optimization reloads the page.
        run: |
          npm run test:browser || {
            echo "::warning::browser tests failed once; retrying after clearing Vite cache"
            rm -rf node_modules/.vite
            npm run test:browser
          }
